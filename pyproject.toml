[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imageautorater"
version = "0.1.0"
description = "Rate photos with pyiqa quality models, add keywords and recognised people to XMP sidecars, and browse the ranking in a web page."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyiqa>=0.1.16",
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.2",
    "transformers>=4.40",
    "requests>=2.31",
    "tqdm>=4.66",
    # openai-clip (used by pyiqa for the clipiqa and liqe models) imports pkg_resources, which setuptools 82 removed
    "setuptools<82",
]

[project.optional-dependencies]
# Person identification, for development (`uv sync --extra faces`; the override below replaces facenet-pytorch's old pins).
# End users install it with `uv pip install --no-deps facenet-pytorch` (see README).
faces = ["facenet-pytorch>=2.6"]
raw = ["rawpy"]

[project.scripts]
imageautorater-rate = "imageautorater.pipeline:main"
imageautorater-write-xmp = "imageautorater.write_xmp:main"
imageautorater-write-exif = "imageautorater.write_exif:main"
imageautorater-gallery = "imageautorater.gallery:main"
# the GUI (PLAN.md) will add:  [project.gui-scripts]  imageautorater = "imageautorater.gui:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/imageautorater"]

# Do NOT add [tool.uv.sources] / [[tool.uv.index]] entries for torch here. uv applies them to everyone who installs this
# package from git, which silently overrides `--torch-backend=auto` and installs the CPU-only PyTorch even on NVIDIA
# machines. Development and CI choose the build on the command line instead (`--torch-backend=cpu`, see the workflow).
[tool.uv]
# facenet-pytorch pins torch<2.3 / torchvision<0.18 / numpy<1.25 / pillow<10.3; replace those pins when it is installed.
override-dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.26", "pillow>=10.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
