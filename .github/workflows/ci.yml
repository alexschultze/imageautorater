name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU-only PyTorch: small, and the runners have no GPU)
        run: |
          uv venv
          uv pip install -e . --group dev --torch-backend=cpu
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Build wheel (smoke test)
        run: uv build
